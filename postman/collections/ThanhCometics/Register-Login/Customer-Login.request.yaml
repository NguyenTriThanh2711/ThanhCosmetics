$kind: http-request
name: Customer/Login
url: "{{host}}/api/Auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"user@example.com\",\r

    \  \"password\": \"string\"\r

    }"
auth:
  type: jwt
  credentials:
    algorithm: HS256
    isSecretBase64Encoded: false
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
order: 2000
